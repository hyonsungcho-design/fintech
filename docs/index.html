  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function kstParts(d) {
    var k = new Date(d.getTime() + 9 * 3600 * 1000);
    return { y: k.getUTCFullYear(), m: k.getUTCMonth() + 1, d: k.getUTCDate(), h: k.getUTCHours(), mi: k.getUTCMinutes() };
  }
  function ymd(p) { return p.y + "-" + pad(p.m) + "-" + pad(p.d); }
  function oneMonthBefore(p) {
    // 한 달 전 같은 날의 다음 날 (그 날이 없으면 다음 달 1일)
    var y = p.y, m = p.m - 1;
    if (m === 0) { m = 12; y -= 1; }
    var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    if (p.d >= last) return { y: m === 12 ? y + 1 : y, m: m === 12 ? 1 : m + 1, d: 1 };
    return { y: y, m: m, d: p.d + 1 };
  }
  function addDay(s) {

  function decode(s) {
    return String(s || "").replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'")
      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").trim();
  }
  function outletFor(sourceUrl) {
    var host = "";
    try { host = new URL(sourceUrl).hostname.toLowerCase(); } catch (e) { return null; }
    for (var i = 0; i < OUTLETS.length; i++) {
      var d = OUTLETS[i][0];
      if (host === d || host.slice(-(d.length + 1)) === "." + d) return OUTLETS[i][1];
    }
    return null;
  }
  function parseRss(text, from, to) {
    var out = [];
    String(text).split("<item>").slice(1).forEach(function (chunk) {
      var t = (chunk.match(/<title>([\s\S]*?)<\/title>/) || [])[1];
      var l = (chunk.match(/<link>([\s\S]*?)<\/link>/) || [])[1];
      var p = (chunk.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1];
      var s = chunk.match(/<source url="([^"]+)">([\s\S]*?)<\/source>/);
      if (!t || !l || !p || !s) return;
      var outlet = outletFor(s[1]);
      if (!outlet) return;
      var when = new Date(decode(p));
      if (isNaN(when)) return;
      var date = ymd(kstParts(when));
      if (date < from || date > to) return;
      var title = decode(t);
      var srcName = decode(s[2]);
      var cut = title.lastIndexOf(" - " + srcName);
      if (cut > 0) title = title.slice(0, cut);
      out.push({ date: date, outlet: outlet, title: title, url: decode(l), auto: true, also: [] });
    });
    return out;
  }
  function norm(t) { return String(t || "").replace(/[\s"'“”‘’…·.,!?()\[\]<>「」『』\-–—:;|/]/g, "").toLowerCase(); }

  function guessCategory(t) {
    if (/순이익|순익|실적|영업이익|연체율|여전채|ABS|ABCP|조달|배당/.test(t)) return "실적·재무";
    if (/유출|해킹|장애|먹통|소송|피해|사고|과징금|검찰|경찰|수사/.test(t)) return "사고·리스크";
    if (/금감원|금융위|제재|규제|수수료율|당국|법안|정부/.test(t)) return "규제·정책";
    if (/인수|합병|매각|지분|제휴|협약|MOU|맞손|손잡/.test(t)) return "제휴·M&A";
    if (/AI|인공지능|스테이블|블록체인|토큰|마이데이터|플랫폼|얼굴|페이스/.test(t)) return "디지털·기술";
    if (/대표|사장|선임|인사|희망퇴직|조직/.test(t)) return "인사·조직";
    if (/기부|후원|ESG|상생|봉사|사회공헌/.test(t)) return "사회공헌·기타";
    return "상품·서비스";
  }
  function guessImportance(cat) {

  }

  function textOf(result) {
    if (!result) return "";

    var blocks = result.content || [];
    for (var i = 0; i < blocks.length; i++) if (blocks[i] && blocks[i].type === "text") return blocks[i].text || "";
    return result.payload ? JSON.stringify(result.payload) : "";

  async function classify(sample, c, kept, fresh) {
    // 같은 사건 묶기, 분류, 한 달 동향 요약을 Claude에 한 번에 묻는다
    var lines = [];
    kept.forEach(function (a, i) { lines.push("E" + i + " | " + a.date + " | " + a.outlet + " | " + a.title); });
    fresh.forEach(function (a, i) { lines.push("N" + i + " | " + a.date + " | " + a.outlet + " | " + a.title); });
    var prompt = "다음은 국내 " + c.name + " 관련 뉴스 기사 목록이다. E로 시작하는 항목은 이미 페이지에 실린 기사, N으로 시작하는 항목은 새로 찾은 기사다.\n" +
      "N 항목마다 다음을 정하라.\n" +
      "- category: " + CATS.join(", ") + " 중 하나\n" +
      "- importance: high(실적 발표, 규제·제재, 대형 사고, M&A 등 업계 영향 큼), mid(주요 상품·제휴), low(일반 프로모션·사회공헌·인사) 중 하나\n" +
      "- dupOf: 같은 사건을 다룬 다른 항목 번호(E 항목 또는 앞선 N 항목, 예: \"E2\", \"N0\"). 없으면 null\n" +
      "그리고 전체 목록을 바탕으로 이 회사의 한 달 동향을 1~2문장 한국어로 digest에 써라. 제목에 없는 사실이나 수치를 지어내지 마라.\n" +
      "JSON만 답하라: {\"digest\":\"...\",\"items\":[{\"id\":\"N0\",\"category\":\"상품·서비스\",\"importance\":\"mid\",\"dupOf\":null}]}\n\n" +
      lines.join("\n");
    return await sample.json(prompt, { modelTier: "quick", cache: false });
  }

  function mergeCompany(c, from, to, fresh, verdict) {
    var kept = (c.articles || []).filter(function (a) { return a.date >= from && a.date <= to; });
    var seen = {};
    kept.forEach(function (a) { seen[norm(a.title)] = true; (a.also || []).forEach(function (o) { if (o.url) seen[o.url] = true; }); });
    var byId = {};
    ((verdict && verdict.items) || []).forEach(function (v) { if (v && v.id) byId[String(v.id)] = v; });
    var added = [];
    fresh.forEach(function (a, i) {
      if (seen[norm(a.title)] || seen[a.url]) return;
      var v = byId["N" + i] || {};
      var dup = v.dupOf ? String(v.dupOf) : null;
      var target = null;
      if (dup && dup.charAt(0) === "E") target = kept[Number(dup.slice(1))];
      if (dup && dup.charAt(0) === "N") target = added.filter(function (x) { return x._n === "N" + dup.slice(1); })[0];
      if (target) {
        target.also = target.also || [];
        if (target.also.length < 3 && target.outlet !== a.outlet) target.also.push({ outlet: a.outlet, url: a.url });
        seen[norm(a.title)] = true;
        return;
      }
      a.category = CATS.indexOf(v.category) >= 0 ? v.category : guessCategory(a.title);
      a.importance = IMP_RANK[v.importance] != null ? v.importance : guessImportance(a.category);
      a._n = "N" + i;
      seen[norm(a.title)] = true;
      added.push(a);
    });
    added.forEach(function (a) { delete a._n; });
    c.articles = pick(kept.concat(added));
    if (verdict && typeof verdict.digest === "string" && verdict.digest.trim()) c.digest = verdict.digest.trim();
    return added.length;
  }

  async function refresh() {
    if (!window.claude || !claude.use) { setStatus("Claude에서 이 페이지를 열어야 현시점 조회를 할 수 있습니다.", true); return; }
    btn.disabled = true; stopBtn.hidden = false; stopRequested = false;
    setStatus("브라우저 연결 중…");
    try {
      var mcp = await claude.use("mcp");
      if (!mcp) { setStatus(FATAL.server_not_connected, true); return; }
      var sample = await claude.use("sample");
      var useClaude = !!sample;

      var now = kstParts(new Date());
      var to = ymd(now), from = ymd(oneMonthBefore(now));
      var addedTotal = 0, failed = [];
      for (var i = 0; i < companies.length; i++) {
        if (stopRequested) break;
        var c = companies[i];
        setStatus(c.name + " 조회 중 (" + (i + 1) + "/" + companies.length + ")");
        var fresh;
        try { fresh = await fetchCompany(mcp, c, from, to); }
        catch (e) {
          var code = e && e.code;
          if (FATAL[code]) { setStatus(FATAL[code], true); return; }
          failed.push(c.name); continue;
        }
        var verdict = null;
        if (useClaude && fresh.length) {
          setStatus(c.name + " 분류 중 (" + (i + 1) + "/" + companies.length + ")");
          var kept = (c.articles || []).filter(function (a) { return a.date >= from && a.date <= to; });
          try { verdict = await classify(sample, c, kept, fresh); }
          catch (e) {
            var sc = e && e.code;
            if (sc === "not_granted" || sc === "sampling_disabled" || sc === "not_declared" || sc === "capability_disabled" || sc === "capability_removed") useClaude = false;
          }
        }
        addedTotal += mergeCompany(c, from, to, fresh, verdict);
        if (state.id === c.id) render();
      }
      data.period = { from: from, to: to };
      data.generatedAt = to;
      data.updatedAt = to + " " + pad(now.h) + ":" + pad(now.mi) + " KST";
      rebuildHighlights();
      renderTop(); render();
      var msg = (stopRequested ? "중지했습니다. " : "") + "새 기사 " + addedTotal + "건을 더했습니다." +
        (failed.length ? " 조회 실패: " + failed.join(", ") + "." : "") +
        (useClaude ? "" : " Claude 분류를 쓰지 못해 제목 키워드로 분류했습니다.");
      setStatus(msg + " " + await save(), failed.length > 0);
    } finally {
      btn.disabled = false; stopBtn.hidden = true;
    }
  }

  // Claude 밖(GitHub Pages 등)에서 열면 버튼 대신 안내만 보여 준다
  if (!window.claude || !window.claude.use) {
    btn.hidden = true;
    setStatus("현시점 조회는 Claude 데스크톱 앱에서 연 페이지에서만 할 수 있습니다.");
  }
  btn.addEventListener("click", function () { refresh(); });
  stopBtn.addEventListener("click", function () { stopRequested = true; setStatus("이번 회사까지 조회하고 멈춥니다…"); });

  renderTop();
  var start = (location.hash || "").slice(1);
  if (!chips[start]) { try { start = localStorage.getItem("cpn-company") || ""; } catch (e) { start = ""; } }
  if (!chips[start]) {
    var firstWith = companies.filter(function (c) { return (c.articles || []).length; })[0] || companies[0];
    start = firstWith ? firstWith.id : "";
  }
  if (start) select(start, false);
})();
</script>

</body></html>
