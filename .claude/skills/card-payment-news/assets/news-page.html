<style id="page-style">
/* Layout: 상단 기간·요약·현시점 조회 → 핵심 이슈 → 회사 선택(카드사/간편결제, 건수 n/30) → 회사별 기사 목록(날짜·언론사·제목·요약) */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #161a22;
  --muted: #5b6474;
  --line: #dde1e8;
  --accent: #1f4fd1;
  --accent-soft: #e6ecfb;
  --on-accent: #ffffff;
  --high: #c4372c;
  --mid: #b7791f;
  --low: #8a93a3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --fg: #e7eaf0; --muted: #98a1b2; --line: #2a303b;
    --accent: #7c9cf5; --accent-soft: #1d2640; --on-accent: #0f1218; --high: #ef7a70; --mid: #e0a94d; --low: #6f7889;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --fg: #e7eaf0; --muted: #98a1b2; --line: #2a303b;
  --accent: #7c9cf5; --accent-soft: #1d2640; --on-accent: #0f1218; --high: #ef7a70; --mid: #e0a94d; --low: #6f7889;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  display: grid; gap: 28px;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

header { display: grid; gap: 8px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
.meta b { color: var(--fg); font-weight: 600; }

.refresh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 6px; }
.btn {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--on-accent);
}
.btn:disabled { opacity: .55; cursor: progress; }
.btn.ghost { background: transparent; color: var(--accent); }
.status { font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.status.warn { color: var(--high); }

.highlights { display: grid; gap: 10px; }
.highlights ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.highlights li { padding-left: 4px; }
.highlights .co { font-weight: 600; margin-right: 6px; }
.highlights .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }

.picker { display: grid; gap: 14px; }
.group { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] .n { color: var(--on-accent); opacity: .85; }
.chip.empty { color: var(--muted); }

.panel { display: grid; gap: 16px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.panel-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
.digest { margin: 0; color: var(--muted); max-width: 70ch; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter {
  font: inherit; font-size: 13px; cursor: pointer; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.item {
  display: grid; grid-template-columns: 96px 112px minmax(0, 1fr); gap: 4px 16px;
  padding: 14px 16px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.outlet { font-size: 13px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.body { min-width: 0; display: grid; gap: 4px; }
.title { font-weight: 600; text-decoration: none; color: var(--fg); overflow-wrap: anywhere; }
.title:hover { color: var(--accent); text-decoration: underline; }
.summary { margin: 0; color: var(--muted); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--muted); }
.imp { display: inline-flex; align-items: center; gap: 5px; }
.imp::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
.imp.high::before { background: var(--high); }
.imp.mid::before { background: var(--mid); }
.cat { padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.auto { padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); }
.also a { color: var(--muted); }
.none { padding: 28px 16px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; }

@media (max-width: 640px) {
  .item { grid-template-columns: auto minmax(0, 1fr); }
  .item .body { grid-column: 1 / -1; }
  h1 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }

  }

  // 화면 그리기

  function renderTop() {

    ["chips-card", "chips-pay"].forEach(function (id) { document.getElementById(id).textContent = ""; });

  }

  function toggleRow(boxId, values, current, onPick) {
    var box = document.getElementById(boxId); box.textContent = "";
    values.forEach(function (v) {
      var b = el("button", "filter", v); b.type = "button";
      b.setAttribute("aria-pressed", String(v === current));
      b.addEventListener("click", function () { onPick(v); });
      box.appendChild(b);
    });
  }

  function render() {
    var c = companies.filter(function (x) { return x.id === state.id; })[0];
    if (!c) return;
    Object.keys(chips).forEach(function (k) { chips[k].setAttribute("aria-pressed", String(k === c.id)); });
    var arts = pick(c.articles || []);
    document.getElementById("co-name").textContent = c.name;
    document.getElementById("co-count").textContent = arts.length + " / " + limit + "건";

    var shown = arts.filter(function (a) { return state.cat === "전체" || a.category === state.cat; });
    if (!shown.length) {
      list.appendChild(el("li", "none", arts.length ? "조건에 맞는 기사 없음" : "기간 내 기사 없음"));
      return;
    }
    shown.forEach(function (a) {
      var li = el("li", "item");
      li.appendChild(el("span", "date", a.date || "날짜 미상"));
      li.appendChild(el("span", "outlet", a.outlet || "언론사 미상"));
      var body = el("div", "body");
      body.appendChild(link(a.title || "(제목 없음)", a.url, "title"));
      if (a.summary) body.appendChild(el("p", "summary", a.summary));
      var tags = el("div", "tags");
      tags.appendChild(el("span", "imp " + (a.importance || "low"), "중요도 " + (IMP[a.importance] || "낮음")));
      if (a.category) tags.appendChild(el("span", "cat", a.category));
      if (a.auto) tags.appendChild(el("span", "auto", "자동 수집"));
      if (a.also && a.also.length) {
        var al = el("span", "also", "같은 보도: ");
        a.also.slice(0, 3).forEach(function (o, i) {
          if (i) al.appendChild(document.createTextNode(", "));
          al.appendChild(link(o.outlet || "기사", o.url));
        });
        tags.appendChild(al);
      }
      body.appendChild(tags);
      li.appendChild(body);
      list.appendChild(li);
    });
  }

  function select(id, remember) {
    state.id = id; state.cat = "전체"; render();
    if (remember) { try { localStorage.setItem("cpn-company", id); } catch (e) {} }
  }

  // ---------- 현시점 조회 ----------
  var btn = document.getElementById("refresh-btn");
  var stopBtn = document.getElementById("stop-btn");
  var statusEl = document.getElementById("refresh-status");
  var stopRequested = false;

  function setStatus(text, warn) { statusEl.textContent = text; statusEl.className = "status" + (warn ? " warn" : ""); }

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function kstParts(d) {
    var k = new Date(d.getTime() + 9 * 3600 * 1000);
    return { y: k.getUTCFullYear(), m: k.getUTCMonth() + 1, d: k.getUTCDate(), h: k.getUTCHours(), mi: k.getUTCMinutes() };
  }
  function ymd(p) { return p.y + "-" + pad(p.m) + "-" + pad(p.d); }
  function oneMonthBefore(p) {
    // 한 달 전 같은 날의 다음 날 (그 날이 없으면 다음 달 1일)
    var y = p.y, m = p.m - 1;
    if (m === 0) { m = 12; y -= 1; }
    var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    if (p.d >= last) return { y: m === 12 ? y + 1 : y, m: m === 12 ? 1 : m + 1, d: 1 };
    return { y: y, m: m, d: p.d + 1 };
  }
  function addDay(s) {
    var d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1);
    return d.toISOString().slice(0, 10);
  }

  function decode(s) {
    return String(s || "").replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'")
      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").trim();
  }
  function outletFor(sourceUrl) {
    var host = "";
    try { host = new URL(sourceUrl).hostname.toLowerCase(); } catch (e) { return null; }
    for (var i = 0; i < OUTLETS.length; i++) {
      var d = OUTLETS[i][0];
      if (host === d || host.slice(-(d.length + 1)) === "." + d) return OUTLETS[i][1];
    }
    return null;
  }
  function parseRss(text, from, to) {
    var out = [];
    String(text).split("<item>").slice(1).forEach(function (chunk) {
      var t = (chunk.match(/<title>([\s\S]*?)<\/title>/) || [])[1];
      var l = (chunk.match(/<link>([\s\S]*?)<\/link>/) || [])[1];
      var p = (chunk.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1];
      var s = chunk.match(/<source url="([^"]+)">([\s\S]*?)<\/source>/);
      if (!t || !l || !p || !s) return;
      var outlet = outletFor(s[1]);
      if (!outlet) return;
      var when = new Date(decode(p));
      if (isNaN(when)) return;
      var date = ymd(kstParts(when));
      if (date < from || date > to) return;
      var title = decode(t);
      var srcName = decode(s[2]);
      var cut = title.lastIndexOf(" - " + srcName);
      if (cut > 0) title = title.slice(0, cut);
      out.push({ date: date, outlet: outlet, title: title, url: decode(l), auto: true, also: [] });
    });
    return out;
  }
  function norm(t) { return String(t || "").replace(/[\s"'“”‘’…·.,!?()\[\]<>「」『』\-–—:;|/]/g, "").toLowerCase(); }

  function guessCategory(t) {
    if (/순이익|순익|실적|영업이익|연체율|여전채|ABS|ABCP|조달|배당/.test(t)) return "실적·재무";
    if (/유출|해킹|장애|먹통|소송|피해|사고|과징금|검찰|경찰|수사/.test(t)) return "사고·리스크";
    if (/금감원|금융위|제재|규제|수수료율|당국|법안|정부/.test(t)) return "규제·정책";
    if (/인수|합병|매각|지분|제휴|협약|MOU|맞손|손잡/.test(t)) return "제휴·M&A";
    if (/AI|인공지능|스테이블|블록체인|토큰|마이데이터|플랫폼|얼굴|페이스/.test(t)) return "디지털·기술";
    if (/대표|사장|선임|인사|희망퇴직|조직/.test(t)) return "인사·조직";
    if (/기부|후원|ESG|상생|봉사|사회공헌/.test(t)) return "사회공헌·기타";
    return "상품·서비스";
  }
  function guessImportance(cat) {
    return (cat === "실적·재무" || cat === "규제·정책" || cat === "사고·리스크" || cat === "제휴·M&A") ? "mid" : "low";
  }

  function textOf(result) {
    if (!result) return "";
    if (typeof result.payload === "string") return result.payload;
    var blocks = result.content || [];
    for (var i = 0; i < blocks.length; i++) if (blocks[i] && blocks[i].type === "text") return blocks[i].text || "";
    return result.payload ? JSON.stringify(result.payload) : "";
  }

  var FATAL = {
    server_not_connected: "Claude 데스크톱 앱에서 이 페이지를 열어야 현시점 조회를 할 수 있습니다.",
    not_in_manifest: "이 페이지의 브라우저 사용이 꺼져 있습니다. 페이지의 권한 메뉴에서 켜 주세요.",
    cancelled: "브라우저 사용을 허용하지 않아 조회를 멈췄습니다.",
    approval_required: "브라우저 사용 승인이 필요합니다. 다시 눌러 승인해 주세요.",
    blocked_by_policy: "조직 정책으로 브라우저 사용이 막혀 있습니다.",
    not_granted: "이 화면에서는 브라우저를 쓸 수 없습니다.",
    capability_disabled: "이 화면에서는 브라우저를 쓸 수 없습니다."
  };

  async function fetchCompany(mcp, c, from, to) {
    var q = QUERY[c.id] || ('"' + c.name + '"');
    q += " after:" + from + " before:" + addDay(to);
    var url = "https://news.google.com/rss/search?q=" + encodeURIComponent(q) + "&hl=ko&gl=KR&ceid=KR:ko";
    await mcp.callTool(BROWSER, "navigate", { url: url }, { cache: false });
    var res = await mcp.callTool(BROWSER, "get_page_text", { max_chars: 120000 }, { cache: false });
    return parseRss(textOf(res), from, to);
  }

  async function classify(sample, c, kept, fresh) {
    // 같은 사건 묶기, 분류, 한 달 동향 요약을 Claude에 한 번에 묻는다
    var lines = [];
    kept.forEach(function (a, i) { lines.push("E" + i + " | " + a.date + " | " + a.outlet + " | " + a.title); });
    fresh.forEach(function (a, i) { lines.push("N" + i + " | " + a.date + " | " + a.outlet + " | " + a.title); });
    var prompt = "다음은 국내 " + c.name + " 관련 뉴스 기사 목록이다. E로 시작하는 항목은 이미 페이지에 실린 기사, N으로 시작하는 항목은 새로 찾은 기사다.\n" +
      "N 항목마다 다음을 정하라.\n" +
      "- category: " + CATS.join(", ") + " 중 하나\n" +
      "- importance: high(실적 발표, 규제·제재, 대형 사고, M&A 등 업계 영향 큼), mid(주요 상품·제휴), low(일반 프로모션·사회공헌·인사) 중 하나\n" +
      "- dupOf: 같은 사건을 다룬 다른 항목 번호(E 항목 또는 앞선 N 항목, 예: \"E2\", \"N0\"). 없으면 null\n" +
      "그리고 전체 목록을 바탕으로 이 회사의 한 달 동향을 1~2문장 한국어로 digest에 써라. 제목에 없는 사실이나 수치를 지어내지 마라.\n" +
      "JSON만 답하라: {\"digest\":\"...\",\"items\":[{\"id\":\"N0\",\"category\":\"상품·서비스\",\"importance\":\"mid\",\"dupOf\":null}]}\n\n" +
      lines.join("\n");
    return await sample.json(prompt, { modelTier: "quick", cache: false });
  }

  function mergeCompany(c, from, to, fresh, verdict) {
    var kept = (c.articles || []).filter(function (a) { return a.date >= from && a.date <= to; });
    var seen = {};
    kept.forEach(function (a) { seen[norm(a.title)] = true; (a.also || []).forEach(function (o) { if (o.url) seen[o.url] = true; }); });
    var byId = {};
    ((verdict && verdict.items) || []).forEach(function (v) { if (v && v.id) byId[String(v.id)] = v; });
    var added = [];
    fresh.forEach(function (a, i) {
      if (seen[norm(a.title)] || seen[a.url]) return;
      var v = byId["N" + i] || {};
      var dup = v.dupOf ? String(v.dupOf) : null;
      var target = null;
      if (dup && dup.charAt(0) === "E") target = kept[Number(dup.slice(1))];
      if (dup && dup.charAt(0) === "N") target = added.filter(function (x) { return x._n === "N" + dup.slice(1); })[0];
      if (target) {
        target.also = target.also || [];
        if (target.also.length < 3 && target.outlet !== a.outlet) target.also.push({ outlet: a.outlet, url: a.url });
        seen[norm(a.title)] = true;
        return;
      }
      a.category = CATS.indexOf(v.category) >= 0 ? v.category : guessCategory(a.title);
      a.importance = IMP_RANK[v.importance] != null ? v.importance : guessImportance(a.category);
      a._n = "N" + i;
      seen[norm(a.title)] = true;
      added.push(a);
    });
    added.forEach(function (a) { delete a._n; });
    c.articles = pick(kept.concat(added));
    if (verdict && typeof verdict.digest === "string" && verdict.digest.trim()) c.digest = verdict.digest.trim();
    return added.length;
  }

  function rebuildHighlights() {
    var all = [];
    companies.forEach(function (c) {
      (c.articles || []).forEach(function (a) { if (a.importance === "high") all.push({ company: c.name, date: a.date, text: a.title, url: a.url }); });
    });
    all.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    if (all.length) data.highlights = all.slice(0, 5);
  }

  function buildDocument() {
    var json = JSON.stringify(data, null, 1).replace(/</g, "\\u003c");
    var reset = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}" +
      "body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" +
      reset + "</style></head><body>" +
      SRC.head + '<style id="page-style">' + SRC.css + "</style>\n\n" +
      '<div class="wrap" id="app-shell">' + SRC.shell + "</div>\n\n" +
      '<script id="news-data" type="application/json">\n' + json + "\n" + SCRIPT_END + "\n\n" +
      '<script id="app-js">' + SRC.js + SCRIPT_END + "\n</body></html>";
  }

  async function save() {
    var artifact = await claude.use("artifact");
    if (!artifact) return "이 화면에만 반영됐습니다. 이 보기에서는 페이지를 저장할 수 없습니다.";
    try {
      await artifact.publish(buildDocument());
      return "저장했습니다. 페이지를 새로 불러옵니다.";
    } catch (e) {
      var code = e && e.code;
      if (code === "conflict") return "다른 곳에서 먼저 저장된 버전으로 새로 불러옵니다.";
      if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared")
        return "이 화면에만 반영됐습니다. 페이지를 저장할 권한이 없습니다.";
      if (code === "too_large") return "이 화면에만 반영됐습니다. 페이지가 너무 커서 저장하지 못했습니다.";
      if (code === "rate_limited") return "이 화면에만 반영됐습니다. 저장이 너무 잦습니다. 잠시 뒤 다시 조회해 주세요.";
      return "이 화면에만 반영됐습니다. 저장 중 오류가 났습니다. 잠시 뒤 다시 조회해 주세요.";
    }
  }

  async function refresh() {
    if (!window.claude || !claude.use) { setStatus("Claude에서 이 페이지를 열어야 현시점 조회를 할 수 있습니다.", true); return; }
    btn.disabled = true; stopBtn.hidden = false; stopRequested = false;
    setStatus("브라우저 연결 중…");
    try {
      var mcp = await claude.use("mcp");
      if (!mcp) { setStatus(FATAL.server_not_connected, true); return; }
      var sample = await claude.use("sample");
      var useClaude = !!sample;

      var now = kstParts(new Date());
      var to = ymd(now), from = ymd(oneMonthBefore(now));
      var addedTotal = 0, failed = [];
      for (var i = 0; i < companies.length; i++) {
        if (stopRequested) break;
        var c = companies[i];
        setStatus(c.name + " 조회 중 (" + (i + 1) + "/" + companies.length + ")");
        var fresh;
        try { fresh = await fetchCompany(mcp, c, from, to); }
        catch (e) {
          var code = e && e.code;
          if (FATAL[code]) { setStatus(FATAL[code], true); return; }
          failed.push(c.name); continue;
        }
        var verdict = null;
        if (useClaude && fresh.length) {
          setStatus(c.name + " 분류 중 (" + (i + 1) + "/" + companies.length + ")");
          var kept = (c.articles || []).filter(function (a) { return a.date >= from && a.date <= to; });
          try { verdict = await classify(sample, c, kept, fresh); }
          catch (e) {
            var sc = e && e.code;
            if (sc === "not_granted" || sc === "sampling_disabled" || sc === "not_declared" || sc === "capability_disabled" || sc === "capability_removed") useClaude = false;
          }
        }
        addedTotal += mergeCompany(c, from, to, fresh, verdict);
        if (state.id === c.id) render();
      }
      data.period = { from: from, to: to };
      data.generatedAt = to;
      data.updatedAt = to + " " + pad(now.h) + ":" + pad(now.mi) + " KST";
      rebuildHighlights();
      renderTop(); render();
      var msg = (stopRequested ? "중지했습니다. " : "") + "새 기사 " + addedTotal + "건을 더했습니다." +
        (failed.length ? " 조회 실패: " + failed.join(", ") + "." : "") +
        (useClaude ? "" : " Claude 분류를 쓰지 못해 제목 키워드로 분류했습니다.");
      setStatus(msg + " " + await save(), failed.length > 0);
    } finally {
      btn.disabled = false; stopBtn.hidden = true;
    }
  }

  btn.addEventListener("click", function () { refresh(); });
  stopBtn.addEventListener("click", function () { stopRequested = true; setStatus("이번 회사까지 조회하고 멈춥니다…"); });

  renderTop();
  var start = (location.hash || "").slice(1);
  if (!chips[start]) { try { start = localStorage.getItem("cpn-company") || ""; } catch (e) { start = ""; } }
  if (!chips[start]) {
    var firstWith = companies.filter(function (c) { return (c.articles || []).length; })[0] || companies[0];
    start = firstWith ? firstWith.id : "";
  }
  if (start) select(start, false);
})();
</script>
